name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheel ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
          - { runner: macos-13,       target: x86_64 }
          - { runner: macos-latest,   target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.88"
          # One abi3 wheel per platform covers every Python from 3.11 up.
          args: --release --out dist --locked
          # Builds inside a manylinux container so the wheel is portable.
          manylinux: auto
      - name: Smoke-test the wheel
        # Catches the packaging faults a build alone does not: missing
        # submodules, absent entry-point metadata, a stub that did not ship.
        if: matrix.platform.runner != 'windows-latest'
        run: |
          python -m pip install --find-links dist deltaswamp
          python -c "
          import deltaswamp as ds
          ds.check_native()
          from deltaswamp.catalog.registry import available_catalogs
          assert set(available_catalogs()) == {'databricks','filesystem','glue','hive','unity'}
          print('wheel OK', ds.__version__)
          "
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          # rust-toolchain.toml pins the version; the action honours it.
          rust-toolchain: "1.88"
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    permissions:
      id-token: write   # trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
