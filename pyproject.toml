[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "deltaswamp"
version = "0.1.0"
description = "One Python connector for every Delta table: Unity Catalog managed and external, Hive Metastore, Glue, and plain object storage."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Stephen Offer" }]
keywords = ["delta", "delta-lake", "unity-catalog", "databricks", "lakehouse", "arrow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Database",
]

# Arrow leaves through the PyCapsule interface, so pyarrow is optional: Polars,
# DuckDB and pandas can consume a scan without it.
dependencies = [
    "deltalake>=1.6.5",     # the DML / maintenance engine
    "databricks-sdk>=0.141.0",  # unified Databricks auth; do not reimplement
]

[project.optional-dependencies]
ray = ["ray[data]>=2.58.0"]
sql = ["pyarrow>=17"]   # the warehouse fallback speaks the Statement Execution API via databricks-sdk
hms = ["pymetastore>=0.4.0"]
glue = ["boto3>=1.35"]
iceberg = ["pyiceberg>=0.12.0"]             # managed Iceberg via the UC IRC endpoint
sharing = ["delta-sharing>=1.4.1"]
pyarrow = ["pyarrow>=17"]
pandas = ["pandas>=2"]
polars = ["polars>=1.39"]
# pytz: DuckDB imports it to hand TIMESTAMP WITH TIME ZONE values to Python
# (fetchall/fetchone), and fails "Required module 'pytz' failed to import"
# on every tz-aware Delta timestamp column without it.
duckdb = ["duckdb>=1.1", "pyarrow>=17", "pytz"]     # to_duckdb, Connection.sql
daft = ["daft>=0.4"]
all = [
    "pyarrow>=17", "pandas>=2", "polars>=1.39", "duckdb>=1.1", "pytz",
    "pyiceberg>=0.12.0", "delta-sharing>=1.4.1", "boto3>=1.35", "pymetastore>=0.4.0",
]
# databricks-connect is never a dependency: it pins requires-python ==3.12.*
# and conflicts with pyspark.
dev = [
    "pytest>=8",
    "pytest-cov",
    "mypy>=1.11",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/stephenoffer/deltaswamp"

# Third parties can ship out-of-tree catalogs (deltaswamp-mycatalog) by
# registering here. Config also accepts a dotted path as an escape hatch.
[project.entry-points."deltaswamp.catalogs"]
databricks = "deltaswamp.catalog.databricks:DatabricksUnityCatalog"
unity = "deltaswamp.catalog.ossuc:OSSUnityCatalog"
hive = "deltaswamp.catalog.hms:HiveMetastoreCatalog"
glue = "deltaswamp.catalog.glue:GlueCatalog"
filesystem = "deltaswamp.catalog.filesystem:FilesystemCatalog"
sharing = "deltaswamp.catalog.sharing:SharingCatalog"

[tool.maturin]
python-source = "python"
module-name = "deltaswamp._native"
manifest-path = "crates/native/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["python/deltaswamp", "tests"]

[[tool.mypy.overrides]]
module = ["deltalake.*", "databricks.*", "pyarrow.*", "ray.*", "pymetastore.*", "polars.*", "boto3.*", "pyiceberg.*", "delta_sharing.*", "duckdb.*", "daft.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets pure-Python tests run without compiling the Rust extension first.
pythonpath = ["python"]
markers = [
    "databricks: requires a live Databricks workspace (set DELTASWAMP_TEST_DATABRICKS=1)",
]
