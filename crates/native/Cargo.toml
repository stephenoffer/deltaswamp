[package]
name = "deltaswamp-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings over delta-kernel-rs for the deltaswamp connector"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
delta_kernel.workspace = true
delta_kernel_default_engine.workspace = true
arrow.workspace = true
pyo3.workspace = true
pyo3-arrow.workspace = true
roaring.workspace = true
# Already in the tree through delta_kernel; used to emit Delta-protocol JSON.
# `raw_value` (additive, unlike `arbitrary_precision`, which would change
# every serde_json::Number in the binary, the kernel's included) lets dml.rs
# copy an add's stats values as written, without a round trip through f64.
serde_json = { version = "1", features = ["raw_value"] }
# Already in the tree through serde_json; the stats visitor in dml.rs.
serde = "1"
tokio.workspace = true
url.workspace = true
uuid.workspace = true
# Encodes the UUID in a deletion vector descriptor; already in the tree through
# delta_kernel, which decodes the same form.
z85 = "3"
# Already in the tree through delta_kernel; the StorageHandler trait reads
# files as `Bytes` (confine.rs wraps it).
bytes = "1"
# Parses retry durations as delta-rs does (object_store's config parsing
# uses it); already in the tree through object_store.
humantime = "2"
# Already in the tree through delta_kernel's default engine and url; VACUUM
# issues its storage requests concurrently and compares decoded keys.
futures = "0.3"
percent-encoding = "2"
# Already in the tree through object_store; its CredentialProvider trait.
async-trait = "0.1"
thiserror.workspace = true
tracing.workspace = true

# The Unity Catalog kernel crates (git-only; see workspace Cargo.toml).
delta-kernel-unity-catalog.workspace = true
unity-catalog-delta-client-api.workspace = true
unity-catalog-delta-rest-client.workspace = true
